<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <style>
      html.tpl-loading body {
        opacity: 0;
      }
      body {
        opacity: 1;
        transition: opacity 0.3s ease;
      }
    </style>
    <script>
      document.documentElement.classList.add('tpl-loading');
      window.__tplReveal = function () {
        document.documentElement.classList.remove('tpl-loading');
      };
      setTimeout(function () {
        window.__tplReveal && window.__tplReveal();
      }, 3000);
    </script>
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta property="og:type" content="website" />
    <title data-page-title>가평 나무의꿈 펜션 - 예약안내</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" type="text/css" href="styles/theme.css" />
    <link rel="stylesheet" type="text/css" href="styles/reset.css" />
    <link rel="stylesheet" type="text/css" href="styles/style.css" />
    <link rel="stylesheet" type="text/css" href="styles/popup.css" />
    <link
      rel="stylesheet"
      type="text/css"
      href="//cdn.jsdelivr.net/npm/swiper@8/swiper-bundle.min.css"
    />
    <!-- Open Graph Meta Tags for Social Media -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="가평 나무의꿈 펜션 - 예약안내" />
  <meta property="og:description" content="남이섬 차량 10분거리에 위치한 가평 나무의꿈펜션입니다. 바로 앞 계곡, 일부객실 애견동반, 야외바베큐, 셀프무인카페가 구비되어있습니다." />
  <meta property="og:image" content="https://bookingplay-media.s3.amazonaws.com/item_images/2024/07/30/t8bkfYhGuzVN.jpg" />
  <meta property="og:url" content="https://treedream.kr" />

  <!-- Twitter Card Meta Tags -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="가평 나무의꿈 펜션 - 예약안내" />
  <meta name="twitter:description" content="남이섬 차량 10분거리에 위치한 가평 나무의꿈펜션입니다. 바로 앞 계곡, 일부객실 애견동반, 야외바베큐, 셀프무인카페가 구비되어있습니다." />
  <meta name="twitter:image" content="https://bookingplay-media.s3.amazonaws.com/item_images/2024/07/30/t8bkfYhGuzVN.jpg" />
  <meta name="naver-site-verification" content="4474e479e929d520c5bda49b045a64cf78142588" />
  <meta name="google-site-verification" content="tUH6XZkZwpj8tOpF_FV9zLy-MpKIdsicM9RI8qSZozw" />
</head>

  <body oncontextmenu="return false;" onselectstart="return false" ondragstart="return false;">
    <div id="wrap">
      <div id="header-wrap"></div>

      <div id="container">
        <section id="content" class="sub4_1 sub_reserve">
          <!-- 원본은 히어로가 슬라이더가 아니라 고정 배경이다 -->
          <div class="sub_wide_visual visual" data-reservation-hero>
            <div class="visual_box">
              <div class="visual_txt">
                <div>
                  <strong>Reservation</strong>
                  <p data-property-caption="{name} 이용안내"></p>
                </div>
              </div>
            </div>
          </div>
          <!--// sub_visual -->

          <div class="sub_cate_wrap">
            <div class="inner">
              <ul>
                <li><a href="#!" target="_blank" data-booking-link>예약하기</a></li>
                <li class="on"><a href="./reservation.html">이용안내</a></li>
              </ul>
            </div>
          </div>

          <div class="sub_cont inner">
            <!-- 매퍼가 dt(제목) + dd(본문) 쌍을 만든다 -->
            <dl class="info_box" data-reservation-blocks></dl>
          </div>
          <!--// sub_cont -->
        </section>
      </div>
      <!--// container -->
    </div>

    <!-- 푸터는 #wrap(max-width:1920px) 밖에 둔다 — 위 테두리(border-top)가 화면 폭을 꽉 채우도록 -->
    <div id="footer-wrap"></div>

    <script src="//cdnjs.cloudflare.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/swiper@8/swiper-bundle.min.js"></script>
    <script src="js/image-helpers.js"></script>
    <script src="js/preview-handler.js"></script>
    <script src="js/data-mapper/core/base-mapper.js"></script>
    <script src="js/data-mapper/pages/header-footer-mapper.js"></script>
    <script src="js/data-mapper/pages/reservation-mapper.js"></script>
    <script src="js/header-footer-loader.js"></script>
    <script src="js/common.js"></script>
    <script src="js/popup.js"></script>
  </body>
</html>
